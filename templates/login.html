
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login | Employee Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>
        :root {
            --accent: #e88b3a;
            --dark: #171717;
            --muted: #77766f;
            --page: #f6f5f0;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: var(--page);
            font-family: Inter, system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: #fff;
            border: 1px solid #e9e7e0;
            border-radius: 22px;
            padding: 36px;
            box-shadow: 0 18px 55px rgba(0, 0, 0, .06);
        }

        .brand-icon {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            background: var(--accent);
            color: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 24px;
        }

        .form-control {
            min-height: 48px;
            border-radius: 10px;
            border-color: #e2e0d9;
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 .2rem rgba(232, 139, 58, .15);
        }

        .btn-login {
            min-height: 48px;
            width: 100%;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: #20170f;
            font-weight: 700;
        }

        .btn-login:hover {
            background: #d97a29;
            color: #fff;
        }

        .muted {
            color: var(--muted);
        }
    </style>
</head>

<body>

<div class="login-card">
    <div class="brand-icon">
        <i class="bi bi-buildings"></i>
    </div>

    <h1 class="h3 fw-bold mb-2">Welcome back</h1>
    <p class="muted mb-4">Sign in to your account to continue.</p>

    {% if error %}
    <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}

    {% if messages %}
        {% for message in messages %}
        <div class="alert alert-info" role="alert">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="mb-3">
            <label for="username" class="form-label fw-semibold">
                Username
            </label>
            <input type="text"
                   id="username"
                   name="username"
                   class="form-control"
                   placeholder="Enter your username"
                   autocomplete="username"
                   required>
        </div>

        
<div class="mb-4">
    <label for="password" class="form-label fw-semibold">
        Password
    </label>

    <div class="position-relative">
        <input type="password"
               id="password"
               name="password"
               class="form-control pe-5"
               placeholder="Enter your password"
               autocomplete="current-password"
               required>

        <button type="button"
                id="togglePassword"
                class="btn position-absolute top-50 end-0 translate-middle-y border-0"
                style="z-index:5;"
                aria-label="Show password"
                aria-pressed="false">
            <i class="bi bi-eye" id="passwordIcon"></i>
        </button>
    </div>
</div>

<script>
    const passwordInput = document.getElementById("password");
    const toggleButton = document.getElementById("togglePassword");
    const passwordIcon = document.getElementById("passwordIcon");

    toggleButton.addEventListener("click", function () {
        const isHidden = passwordInput.type === "password";

        passwordInput.type = isHidden ? "text" : "password";
        passwordIcon.className = isHidden ? "bi bi-eye-slash" : "bi bi-eye";

        toggleButton.setAttribute("aria-pressed", String(isHidden));
        toggleButton.setAttribute(
            "aria-label",
            isHidden ? "Hide password" : "Show password"
        );
    });
</script>


        <button type="submit" class="btn btn-login">
            Sign In <i class="bi bi-arrow-right ms-2"></i>
        </button>
    </form>

    <p class="muted small text-center mt-4 mb-0">
        Employee Management System
    </p>
</div>

</body>
</html>
